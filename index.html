<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boss Rosh Moments</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: radial-gradient(ellipse at 50% 35%, #29203c 0%, #11101c 48%, #08090c 100%);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 28px 20px;
      position: relative;
      isolation: isolate;
    }
    body::before {
      content: "😂      💀       🤣      🗿       😭      🤡       😂      💀       🤣      🗿       😭      🤡";
      position: fixed;
      inset: -10%;
      z-index: -1;
      display: block;
      color: rgba(255,255,255,.10);
      font-size: clamp(32px, 5vw, 68px);
      line-height: 2.1;
      letter-spacing: 22px;
      overflow-wrap: anywhere;
      transform: rotate(-12deg) scale(1.15);
      pointer-events: none;
      user-select: none;
      filter: blur(.25px);
    }
    body::after {
      content: "MEME MODE  •  BRUH  •  NO WAY  •  LOL  •  MOMENT  •  MEME MODE  •  BRUH  •  NO WAY";
      position: fixed;
      inset: auto -5% 8% -5%;
      z-index: -1;
      color: rgba(255,255,255,.055);
      font-size: clamp(14px, 2.2vw, 25px);
      font-weight: 1000;
      letter-spacing: 8px;
      white-space: nowrap;
      transform: rotate(-5deg);
      pointer-events: none;
      user-select: none;
    }
    main { width: min(100%, 960px); text-align: center; position: relative; }
    h1 {
      margin: 0 0 25px;
      font-size: clamp(36px, 7vw, 76px);
      line-height: 1.05;
      font-weight: 1000;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #ff3d7f, #ffb02e, #f9f871, #45e6a5, #43b9ff, #b17aff, #ff3d7f);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbowFlow 5s linear infinite, titleFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 4px 16px rgba(255,255,255,.12));
    }
    @keyframes rainbowFlow { to { background-position: 300% 50%; } }
    @keyframes titleFloat { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-7px) rotate(1deg); } }
    .video-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.65), 0 0 35px rgba(177,122,255,.18);
    }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .hint { margin-top: 15px; color: rgba(255,255,255,.68); font-size: 13px; }
    .start-button {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 18px; border: 0; border-radius: 999px; padding: 15px 28px;
      background: linear-gradient(90deg, #ff3d7f, #ffb02e, #45e6a5, #43b9ff, #b17aff);
      color: #111; font: 900 16px system-ui, sans-serif;
      cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,.4);
      transition: transform .15s ease, filter .15s ease;
    }
    .start-button:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.08); }
    .start-button:active { transform: scale(.98); }
    .status { min-height: 1.4em; margin: 10px 0 0; color: rgba(255,255,255,.75); font-size: 13px; }
    @media (max-width: 600px) {
      body { padding: 18px 12px; }
      h1 { letter-spacing: -1px; margin-bottom: 20px; }
      .video-wrap { border-radius: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Boss Rosh Moments</h1>
    <div class="video-wrap">
      <video id="prankVideo" autoplay loop playsinline controls>
        <source src="/Video/mp4.mp4" type="video/mp4" />
        Your browser does not support video playback.
      </video>
    </div>
    <p class="hint">😂 Certified Boss Rosh moments. Replay forever. 💀</p>
    <button class="start-button" id="startButton" type="button">▶ Start video with sound</button>
    <p class="status" id="videoStatus" aria-live="polite">Press start if the video doesn't autoplay.</p>
  </main>
  <script>
    const video = document.getElementById('prankVideo');
    const startButton = document.getElementById('startButton');
    const status = document.getElementById('videoStatus');

    video.loop = true;
    video.playsInline = true;
    video.muted = false;
    video.defaultMuted = false;

    video.play().then(() => {
      status.textContent = 'Now playing with sound 🔊';
    }).catch(() => {
      status.textContent = 'Autoplay was blocked. Press the button to start with sound.';
    });

    startButton.addEventListener('click', async () => {
      video.pause();
      video.muted = false;
      video.defaultMuted = false;
      status.textContent = 'Starting video…';
      try {
        await video.play();
        status.textContent = 'Now playing with sound 🔊';
        startButton.textContent = '▶ Restart video';
      } catch (error) {
        status.textContent = video.error
          ? 'Video file could not be loaded. Make sure video.mp4 is beside index.html.'
          : 'Playback was blocked. Check that video.mp4 is available, then try again.';
      }
    });

    video.addEventListener('playing', () => {
      status.textContent = video.muted ? 'Playing muted' : 'Now playing with sound 🔊';
    });
    video.addEventListener('error', () => {
      status.textContent = 'Could not load video.mp4. Put the video in the same folder as index.html.';
    });
  </script>
</body>
</html>
